name: verify-n4
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Carcara
        run: cargo install --git https://github.com/ufmg-smite/carcara.git --locked
      - name: Get cvc5
        run: |
          curl -L -o cvc5.zip https://github.com/cvc5/cvc5/releases/latest/download/cvc5-Linux-x86_64-static.zip
          unzip -q cvc5.zip
          echo "$PWD/cvc5-Linux-x86_64-static/bin" >> $GITHUB_PATH
      - name: Produce and check Alethe proofs
        run: |
          set -euxo pipefail
          mkdir -p out
          for m in 8 9 10 11 12; do
            echo "===== m=$m : build smt2 ====="
            python3 ci/dump_smt2.py --m $m > out/m$m.smt2
            sha256sum out/m$m.smt2 >> out/hashes.txt
            echo "===== m=$m : cvc5 -> alethe ====="
            cvc5 --produce-proofs --proof-format-mode=alethe --dump-proofs out/m$m.smt2 > out/m$m.alethe
            head -1 out/m$m.alethe
            echo "===== m=$m : carcara check ====="
            carcara check --allow-int-real-subtyping out/m$m.alethe out/m$m.smt2
          done
      - uses: actions/upload-artifact@v4
        with:
          name: alethe-proofs
          path: out/
