name: verify-n4
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cvc5-compatible Carcara (pinned commit)
        run: |
          git clone https://github.com/hanielb/carcara.git carcara-src
          cd carcara-src
          git checkout 394edbb15ba95c47893f1d821fddde7e016af178
          cargo build --release
          echo "$PWD/target/release" >> $GITHUB_PATH
      - name: Get cvc5
        run: |
          curl -L -o cvc5.zip https://github.com/cvc5/cvc5/releases/latest/download/cvc5-Linux-x86_64-static.zip
          unzip -q cvc5.zip
          echo "$PWD/cvc5-Linux-x86_64-static/bin" >> $GITHUB_PATH
      - name: Produce (fine-grained) and check proofs
        run: |
          set -uo pipefail
          mkdir -p out
          for m in 8 9 10 11 12; do
            echo "========== m=$m =========="
            python3 ci/dump_smt2.py --m $m > out/m$m.smt2
            cvc5 --produce-proofs --proof-format-mode=alethe \
                 --proof-granularity=theory-rewrite --simplification=none --dag-thresh=0 \
                 --dump-proofs out/m$m.smt2 > out/m$m.alethe
            echo "proof head:"; head -1 out/m$m.alethe
            echo "--- strict check ---"
            ( carcara check --allow-int-real-subtyping --expand-let-bindings out/m$m.alethe out/m$m.smt2 2>&1 || true ) | tail -6
          done
